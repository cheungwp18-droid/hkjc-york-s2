<!DOCTYPE html>
<html lang="zh-HK"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S4 ｜ 排位尚未發布 排位表 2026-08-22</title><style>
* { box-sizing: border-box; }
body { font-family: -apple-system, "PingFang HK", "Microsoft YaHei", sans-serif;
      margin: 0; background: #eef2ef; color: #1a1a1a; }
header { background: #0b3d2e; color: #fff; padding: 14px 20px; }
header h1 { margin: 0; font-size: 18px; font-weight: 650; }
header .sub { opacity: .82; font-size: 12px; margin-top: 3px; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 0 40px; }
.tabs { display: flex; gap: 0; overflow-x: auto; background: #0b3d2e; padding: 0 12px 0; }
.tab { flex: 0 0 auto; min-width: 58px; border: 0; background: transparent; color: #c5ddd4;
       padding: 10px 12px 8px; cursor: pointer; text-align: center; border-bottom: 3px solid transparent; }
.tab b { display: block; font-size: 16px; line-height: 1.1; color: #fff; }
.tab small { display: block; font-size: 11px; opacity: .8; margin-top: 2px; }
.tab:hover { background: rgba(255,255,255,.06); }
.tab.on { background: #fff; color: #0b3d2e; border-bottom-color: #c9a227; }
.tab.on b, .tab.on small { color: #0b3d2e; }
.search-bar { display: flex; gap: 8px; align-items: center; padding: 10px 16px; background: #fff;
              border-bottom: 1px solid #e5e7eb; }
.search-bar input { flex: 1; padding: 7px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; }
.hit { color: #6b7280; font-size: 12px; }
.panel { background: #fff; }
.rh { padding: 14px 16px 8px; border-bottom: 1px solid #eef0f2; }
.rh h2 { margin: 0 0 4px; font-size: 17px; color: #0b3d2e; }
.rh .meta { color: #5b6570; font-size: 13px; }
.advice { padding: 12px 16px 14px; background: #f7f5ee; border-bottom: 1px solid #e8dfc8; }
.advice > h3 { margin: 0 0 10px; font-size: 15px; color: #0b3d2e; }
.advice-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
@media (max-width: 860px) { .advice-grid { grid-template-columns: 1fr 1fr; } }
.ad { background: #fff; border-radius: 6px; padding: 9px 11px; border-top: 3px solid #c9a227; }
.ad.place { border-top-color: #3b82f6; }
.ad.q { border-top-color: #0b6e4f; }
.ad.value { border-top-color: #6b7280; }
.ad .k { font-size: 11px; font-weight: 700; color: #92400e; margin-bottom: 4px; }
.ad.place .k { color: #1e40af; }
.ad.q .k { color: #0b6e4f; }
.ad.value .k { color: #374151; }
.ad .v { font-size: 13px; line-height: 1.45; }
.ad .s { font-size: 12px; color: #6b7280; margin-top: 3px; }
.combo-box { margin-top: 12px; }
.combo-box h4 { margin: 0 0 6px; font-size: 13px; color: #0b3d2e; }
.combo-box th { background: #e8efe9; color: #374151; text-align: center; }
.combo-box td { font-size: 13px; text-align: center; }
.out { padding: 8px 16px; background: #fef2f2; color: #991b1b; font-size: 13px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { background: #0b3d2e; color: #fff; font-weight: 600; white-space: nowrap;
     padding: 8px 8px; text-align: center; font-size: 12px; }
th.sort { cursor: pointer; user-select: none; }
th.sort:hover { background: #145c45; }
th.sort::after { content: " \2195"; opacity: .45; font-size: 10px; }
th.sort.asc::after { content: " \25B2"; opacity: 1; }
th.sort.desc::after { content: " \25BC"; opacity: 1; }
td { padding: 7px 8px; border-bottom: 1px solid #eef0f2; vertical-align: middle;
     text-align: center; }
tr:hover td { background: #f4faf7; }
tr.win-row td { background: #fff8e1; }
tr.place-row td { background: #f3f8ff; }
tr.scr-row td { background: #fafafa; color: #9ca3af; text-decoration: line-through; }
.no { font-weight: 700; text-align: center; width: 42px; }
.star { color: #c9a227; margin-left: 2px; }
.name { min-width: 120px; text-align: center; }
.name small { display: block; color: #6b7280; font-size: 12px; }
.num { text-align: center; font-variant-numeric: tabular-nums; white-space: nowrap; }
.bar { height: 4px; background: #e5e7eb; border-radius: 2px; margin: 3px auto 0;
       position: relative; min-width: 48px; max-width: 72px; }
.bar > i { position: absolute; left: 0; top: 0; bottom: 0; background: #0b6e4f; border-radius: 2px; }
.note { color: #8a94a6; font-size: 11px; padding: 10px 16px 16px; }
.empty { text-align: center; color: #9ca3af; padding: 40px 0; display: none; background: #fff; }
.tbl-wrap { overflow-x: auto; }
.race-block { display: none; }
.race-block.on { display: block; }
</style></head>
<body>
<header>
  <h1>S4 ｜ 排位尚未發布</h1>
  <div class="sub">2026-08-22 ｜ 預設按預測名次 ｜ 點欄位可排序 ｜ 資料 not_published</div>
</header>
<nav class="tabs" id="race-tabs"></nav>
<div class="search-bar">
  <input id="q" type="search" placeholder="搜尋馬號／馬名／騎師／練馬師">
  <span class="hit" id="hit-count"></span>
</div>
<div class="wrap">

<div class="empty" id="empty">沒有符合的馬匹</div>
</div>
<script>

(function(){
  var q = document.getElementById('q');
  var count = document.getElementById('hit-count');
  var tabs = document.getElementById('race-tabs');
  var empty = document.getElementById('empty');
  var first = document.querySelector('.race-block');
  var race = first ? first.getAttribute('data-race') : '1';
  function norm(s){ return (s || '').toLowerCase(); }
  function setRace(n, push){
    race = String(n);
    if (push !== false && history.replaceState) {
      history.replaceState(null, '', '#r' + race);
    }
    apply();
  }
  function apply(){
    var term = norm(q && q.value);
    var raceByNum = /^\d+$/.test(term) && document.querySelector('.race-block[data-race="'+term+'"]');
    var shownRows = 0;
    document.querySelectorAll('.race-block').forEach(function(block){
      var rno = block.getAttribute('data-race');
      var on = (rno === race);
      block.classList.toggle('on', on);
      if (!on) return;
      block.querySelectorAll('tbody tr[data-horse]').forEach(function(tr){
        var hay = norm(tr.getAttribute('data-horse'));
        var ok = !term || raceByNum || hay.indexOf(term) >= 0;
        tr.hidden = !ok;
        if (ok) shownRows += 1;
      });
    });
    if (count) count.textContent = shownRows ? (shownRows + ' 匹') : '';
    if (empty) empty.style.display = shownRows ? 'none' : 'block';
    document.querySelectorAll('#race-tabs .tab').forEach(function(c){
      c.classList.toggle('on', c.getAttribute('data-race') === race);
    });
  }
  if (tabs) tabs.addEventListener('click', function(e){
    var b = e.target.closest('[data-race]');
    if (!b) return;
    if (q) q.value = '';
    setRace(b.getAttribute('data-race'));
  });
  if (q) q.addEventListener('input', function(){
    var term = norm(q.value);
    if (/^\d+$/.test(term) && document.querySelector('.race-block[data-race="'+term+'"]')) {
      setRace(term, true);
      return;
    }
    apply();
  });
  var m = (location.hash || '').match(/^#r(\d+)/);
  if (m) race = m[1];
  apply();

  var defaultDir = {rank:1, no:1, draw:1, lb:1, rating:-1, odds:1, pla:1, win:-1, place:-1};
  function sortRunners(table, key, dir){
    var tb = table.tBodies[0];
    if (!tb) return;
    var rows = Array.prototype.slice.call(tb.querySelectorAll('tr'));
    rows.sort(function(a, b){
      var av = parseFloat(a.getAttribute('data-' + key));
      var bv = parseFloat(b.getAttribute('data-' + key));
      if (isNaN(av)) av = 0;
      if (isNaN(bv)) bv = 0;
      if (av === bv) {
        return (parseInt(a.getAttribute('data-no'), 10) || 0)
             - (parseInt(b.getAttribute('data-no'), 10) || 0);
      }
      return (av - bv) * dir;
    });
    rows.forEach(function(r){ tb.appendChild(r); });
  }
  document.querySelectorAll('table.runners').forEach(function(table){
    table.querySelectorAll('th.sort').forEach(function(th){
      th.addEventListener('click', function(){
        var key = th.getAttribute('data-sort');
        var dir;
        if (th.classList.contains('asc')) dir = -1;
        else if (th.classList.contains('desc')) dir = 1;
        else dir = defaultDir[key] || 1;
        table.querySelectorAll('th.sort').forEach(function(x){
          x.classList.remove('asc', 'desc');
        });
        th.classList.add(dir === 1 ? 'asc' : 'desc');
        sortRunners(table, key, dir);
      });
    });
  });
})();

</script>
</body></html>
